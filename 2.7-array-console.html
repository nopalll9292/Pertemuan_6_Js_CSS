<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>2.7 Array dan Method console</title>
</head>
<body>
  <h1>2.7 Array dan Method console</h1>

  <script>
    let buah = ["Apel", "Jeruk", "Mangga"];
    buah.push("Pisang");

    console.log(buah[0]);       
    console.log(buah.length);   

    for (let i = 0; i < buah.length; i++) {
      console.log((i + 1) + ". " + buah[i]);
    }
  </script>
</body>
</html>
