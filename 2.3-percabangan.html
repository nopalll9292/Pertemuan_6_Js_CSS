<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>2.3 Percabangan (if ... else)</title>
</head>
<body>
  <h1>2.3 Percabangan (if ... else)</h1>


  <script>
    let nilai = 78;

    if (nilai >= 80) {
      console.log("Grade A");
    } else if (nilai >= 70) {
      console.log("Grade B");
    } else {
      console.log("Grade C");
    }

  </script>
</body>
</html>
