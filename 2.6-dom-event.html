<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>2.6 DOM dan Event</title>
</head>
<body>
  <h1>2.6 DOM dan Event</h1>

  <input type="text" id="nama" placeholder="Nama Anda">
  <button onclick="sapa()">Sapa</button>
  <p id="hasil"></p>

  <script>
    function sapa() {
      let nama = document.getElementById("nama").value;
      let pesan = "yohoo, " + nama + "!";

      document.getElementById("hasil").textContent = pesan;
    }
  </script>
</body>
</html>
